backend:
  name: github
  repo: AliMurad-intpath/online-menus
  branch: main
local_backend: true                   # lets you test with `npx decap-server`
media_folder: public/images/dishes
public_folder: /images/dishes

collections:
  - name: menu
    label: Menu
    files:
      - name: menu
        label: Menu content
        file: public/content/menu.json
        format: json
        fields:
          - label: Restaurant
            name: restaurant
            widget: object
            fields:
              - {label: Name (English), name: name_en, widget: string}
              - {label: Name (Arabic), name: name_ar, widget: string}
              - {label: Logo, name: logo, widget: image, required: false, media_folder: "/public/images", public_folder: "/images", hint: "Shown on the home page. A transparent PNG or SVG works best. Leave empty to show no logo."}
              - {label: Home page background photo, name: cover, widget: image, required: false, media_folder: "/public/images", public_folder: "/images", hint: "Optional. A dark, portrait photo works best."}
              - {label: Tagline (English), name: tagline_en, widget: string, required: false}
              - {label: Tagline (Arabic), name: tagline_ar, widget: string, required: false}
              - {label: Instagram username (no @), name: instagram, widget: string}
              - {label: Currency symbol (English), name: currency_en, widget: string, default: "$"}
              - {label: Currency symbol (Arabic), name: currency_ar, widget: string, default: "$"}
              - {label: Lock the menu button until the guest follows, name: lock, widget: boolean, default: true}
              - {label: Show a "skip" link, name: skip, widget: boolean, default: true}
              - {label: Show labels on dishes (Spicy, Vegan...), name: show_labels, widget: boolean, default: true, hint: "Turn off to hide all labels on the menu."}
          - label: Instagram pop-up
            name: popup
            widget: object
            collapsed: true
            hint: "A small reminder that appears once per visit while a guest browses the menu."
            fields:
              - {label: Show the pop-up, name: enabled, widget: boolean, default: true}
              - {label: Seconds before it appears, name: delay, widget: number, value_type: int, min: 3, max: 300, default: 10}
              - {label: Title (English), name: title_en, widget: string}
              - {label: Title (Arabic), name: title_ar, widget: string}
              - {label: Message (English), name: text_en, widget: text}
              - {label: Message (Arabic), name: text_ar, widget: text}
              - {label: Follow button text (English), name: button_en, widget: string}
              - {label: Follow button text (Arabic), name: button_ar, widget: string}
              - {label: Dismiss link text (English), name: later_en, widget: string}
              - {label: Dismiss link text (Arabic), name: later_ar, widget: string}
          - label: Labels (Spicy, Vegan...)
            name: labels
            widget: list
            collapsed: true
            summary: "{{fields.name_en}} / {{fields.name_ar}}"
            hint: "Add, rename or delete labels. Then pick them on each dish under Labels. Deleting a label removes it from the menu."
            fields:
              - {label: Short code (lowercase, no spaces, never change it later), name: id, widget: string, pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and dashes only"]}
              - {label: Name (English), name: name_en, widget: string}
              - {label: Name (Arabic), name: name_ar, widget: string}
          - label: Categories
            name: categories
            widget: list
            summary: "{{fields.name_en}} / {{fields.name_ar}}"
            fields:
              - {label: Short code (lowercase, no spaces, never change it later), name: id, widget: string, pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and dashes only"]}
              - {label: Name (English), name: name_en, widget: string}
              - {label: Name (Arabic), name: name_ar, widget: string}
          - label: Dishes
            name: items
            widget: list
            summary: "{{fields.name_en}} / {{fields.name_ar}}"
            fields:
              - label: Category
                name: category
                widget: relation
                collection: menu
                file: menu
                search_fields: ["categories.*.name_en"]
                value_field: "categories.*.id"
                display_fields: ["categories.*.name_en"]
              - {label: Name (English), name: name_en, widget: string}
              - {label: Name (Arabic), name: name_ar, widget: string}
              - {label: Description (English), name: desc_en, widget: text, required: false}
              - {label: Description (Arabic), name: desc_ar, widget: text, required: false}
              - {label: Price, name: price, widget: number, value_type: float, min: 0, required: false, hint: "Leave empty if the dish has sizes below."}
              - label: Sizes
                name: sizes
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.label_en}} · {{fields.price}}"
                hint: "Optional. For dishes sold in more than one size (half / whole). When used, the menu shows 'From' the lowest price."
                fields:
                  - {label: Size (English), name: label_en, widget: string}
                  - {label: Size (Arabic), name: label_ar, widget: string}
                  - {label: Price, name: price, widget: number, value_type: float, min: 0}
              - {label: Photo, name: image, widget: image, required: false, hint: "Any JPG or PNG up to about 2 MB. A transparent PNG or WebP of a round plate looks best. The site resizes it automatically. To replace it, click Choose different image."}
              - label: Labels
                name: tags
                widget: relation
                collection: menu
                file: menu
                multiple: true
                required: false
                search_fields: ["labels.*.name_en"]
                value_field: "labels.*.id"
                display_fields: ["labels.*.name_en"]
                hint: "Optional. Manage the list of labels in the Labels section above."
              - label: Allergens
                name: allergens
                widget: select
                multiple: true
                required: false
                options: [{label: Gluten, value: gluten}, {label: Dairy, value: dairy}, {label: Eggs, value: eggs}, {label: Nuts, value: nuts}, {label: Peanuts, value: peanuts}, {label: Fish, value: fish}, {label: Shellfish, value: shellfish}, {label: Soy, value: soy}, {label: Sesame, value: sesame}]
              - {label: Available today, name: available, widget: boolean, default: true}
              - {label: Show in "Popular", name: popular, widget: boolean, default: false}

  - name: recipes
    label: Recipes (private)
    folder: private/recipes
    create: true
    extension: yml
    format: yaml
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - {label: Dish name, name: title, widget: string}
      - {label: Portions this recipe makes, name: portions, widget: number, default: 1}
      - label: Ingredients
        name: ingredients
        widget: list
        fields:
          - {label: Ingredient and amount, name: name, widget: string}
          - {label: Cost, name: cost, widget: number, value_type: float}
      - {label: Preparation steps, name: steps, widget: text, required: false}
